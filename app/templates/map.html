{% extends "base.html" %}

{% block extra_head %}
<link rel="stylesheet" href="{{ request.scope.root_path }}/static/vendor/leaflet/leaflet.css?v={{ app_version }}">
<link rel="stylesheet" href="{{ request.scope.root_path }}/static/css/map.css?v={{ app_version }}">
{% endblock %}

{% block content %}
<section class="panel map-panel">
    <div class="panel-body">
        <div
            id="map-root"
            class="map-page"
            data-station-latitude="{{ map_config.station_latitude }}"
            data-station-longitude="{{ map_config.station_longitude }}"
            data-station-source-key="{{ map_station_source_key }}"
            data-default-zoom="{{ map_config.default_zoom }}"
            data-stations-endpoint="{{ map_stations_endpoint }}"
            data-map-tile-events-endpoint="{{ map_tile_events_endpoint }}"
            data-traffic-stream-endpoint="{{ map_traffic_stream_endpoint }}"
            data-tile-url="{{ map_config.tile_url }}"
            data-tile-attribution="{{ map_config.tile_attribution }}"
            data-tile-source-name="{{ map_config.tile_source_name }}"
            data-tile-min-zoom="{{ map_config.tile_min_zoom }}"
            data-tile-max-zoom="{{ map_config.tile_max_zoom }}"
            data-tile-subdomains="{{ map_config.tile_subdomains }}"
            data-static-root="{{ request.scope.root_path }}/static/"
            data-root-path="{{ request.scope.root_path }}"
            data-i18n-aprs-client="{{ t('APRS client') }}"
            data-i18n-last-activity="{{ t('Last activity') }}"
            data-i18n-age="{{ t('Age') }}"
            data-i18n-source="{{ t('Source') }}"
            data-i18n-path="{{ t('Path') }}"
            data-i18n-destination="{{ t('Destination') }}"
            data-i18n-distance="{{ t('Distance') }}"
            data-i18n-speed="{{ t('Speed') }}"
            data-i18n-course="{{ t('Course') }}"
            data-i18n-altitude="{{ t('Altitude') }}"
            data-i18n-packet-type="{{ t('Packet type') }}"
            data-i18n-comment="{{ t('Comment') }}"
            data-i18n-reset-view="{{ t('Reset view') }}"
            data-i18n-callsign="{{ t('Callsign') }}"
            data-i18n-latest-packet="{{ t('Latest packet') }}"
            data-i18n-distance-azimuth="{{ t('Distance and azimuth') }}"
            data-i18n-qsy="{{ t('QSY') }}"
            data-i18n-no-stations="{{ t('No decoded APRS stations available yet.') }}"
            data-i18n-no-frames="{{ t('No frames received yet.') }}"
            data-i18n-traffic-monitor="{{ t('Traffic Monitor') }}"
            data-i18n-show-tracks="{{ t('Show tracks') }}"
            data-i18n-hide-tracks="{{ t('Hide tracks') }}"
            data-i18n-show-coverage="{{ t('Show coverage') }}"
            data-i18n-hide-coverage="{{ t('Hide coverage') }}"
            data-i18n-show-latest-overlay="{{ t('Show latest packet widget') }}"
            data-i18n-hide-latest-overlay="{{ t('Hide latest packet widget') }}"
            data-i18n-show-ruler="{{ t('Show ruler') }}"
            data-i18n-hide-ruler="{{ t('Hide ruler') }}"
            data-i18n-tile-provider-unavailable="{{ t('Tile provider unavailable') }}"
            data-i18n-tile-provider-recovered="{{ t('Tile provider recovered') }}"
            data-i18n-show="{{ t('Show') }}"
            data-i18n-hide="{{ t('Hide') }}"
        >
            <div class="map-toolbar" role="toolbar" aria-label="{{ t('Map controls') }}">
                <div class="map-toolbar-actions">
                    <button
                        type="button"
                        class="button button-secondary button-icon"
                        id="map-reset-view"
                        aria-label="{{ t('Reset view') }}"
                        title="{{ t('Reset view') }}"
                    >
                        <img src="{{ request.scope.root_path }}/static/icons/crosshairs-gps.svg" alt="">
                    </button>
                    <button
                        type="button"
                        class="button button-secondary button-icon"
                        id="map-toggle-tracks"
                        aria-label="{{ t('Hide tracks') }}"
                        title="{{ t('Hide tracks') }}"
                    >
                        <img id="map-toggle-tracks-icon" src="{{ request.scope.root_path }}/static/icons/track-light.svg" alt="">
                    </button>
                    <button
                        type="button"
                        class="button button-secondary button-icon"
                        id="map-toggle-coverage"
                        aria-label="{{ t('Hide coverage') }}"
                        title="{{ t('Hide coverage') }}"
                    >
                        <img id="map-toggle-coverage-icon" src="{{ request.scope.root_path }}/static/icons/map-marker-radius.svg" alt="">
                    </button>
                    <button
                        type="button"
                        class="button button-secondary button-icon"
                        id="map-toggle-latest-overlay"
                        aria-label="{{ t('Hide latest packet widget') }}"
                        title="{{ t('Hide latest packet widget') }}"
                    >
                        <img id="map-toggle-latest-overlay-icon" src="{{ request.scope.root_path }}/static/icons/message-alert.svg" alt="">
                    </button>
                    <button
                        type="button"
                        class="button button-secondary button-icon"
                        id="map-toggle-scroller"
                        aria-label="{{ t('Hide') }} {{ t('Traffic Monitor') }}"
                        title="{{ t('Hide') }} {{ t('Traffic Monitor') }}"
                    >
                        <img id="map-toggle-scroller-icon" src="{{ request.scope.root_path }}/static/icons/format-list-bulleted.svg" alt="">
                    </button>
                    <button
                        type="button"
                        class="button button-secondary button-icon"
                        id="map-toggle-ruler"
                        aria-label="{{ t('Hide ruler') }}"
                        title="{{ t('Hide ruler') }}"
                    >
                        <img id="map-toggle-ruler-icon" src="{{ request.scope.root_path }}/static/icons/ruler.svg" alt="">
                    </button>
                    <label class="map-mask-opacity-control" for="map-mask-opacity">
                        <select id="map-mask-opacity" class="map-mask-opacity-select" aria-label="{{ t('Mask opacity') }}">
                            {% for value in range(0, 101, 10) %}
                            <option value="{{ value }}">{{ value }}%</option>
                            {% endfor %}
                        </select>
                    </label>
                    <div id="map-interface-filters" class="map-interface-filters" aria-live="polite"></div>
                </div>
                <div class="map-info-strip" aria-live="polite">
                    <span>
                        <strong>{{ t("Tiles") }}:</strong>
                        <span id="map-tile-source">{{ map_config.tile_source_name }}</span>
                        <span id="map-tile-status" class="muted"></span>
                    </span>
                    <span><strong>{{ t("Center") }}:</strong> <span id="map-center">--</span></span>
                    <span><strong>{{ t("Zoom") }}:</strong> <span id="map-zoom">--</span></span>
                </div>
            </div>
            <div id="map-stage" class="map-stage">
                <div id="map-canvas" class="map-canvas" aria-label="{{ t('Map viewer') }}"></div>
                <div id="map-overlay-stack" class="map-overlay-stack">
                    <aside id="map-latest-overlay" class="map-latest-overlay" aria-live="polite"></aside>
                    <aside id="map-scroller-overlay" class="map-scroller-overlay" aria-live="polite"></aside>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script src="{{ request.scope.root_path }}/static/vendor/leaflet/leaflet.js?v={{ app_version }}"></script>
<script src="{{ request.scope.root_path }}/static/js/map-latest-overlay.js?v={{ app_version }}"></script>
<script src="{{ request.scope.root_path }}/static/js/map-scroller-overlay.js?v={{ app_version }}"></script>
<script src="{{ request.scope.root_path }}/static/js/map.js?v={{ app_version }}"></script>
{% endblock %}
