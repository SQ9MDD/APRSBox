{% extends "base.html" %}

{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', path='vendor/leaflet/leaflet.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='css/map.css') }}">
{% endblock %}

{% block content %}
<section class="panel map-panel">
    <div
        id="map-root"
        class="map-page"
        data-station-latitude="{{ map_config.station_latitude }}"
        data-station-longitude="{{ map_config.station_longitude }}"
        data-default-zoom="{{ map_config.default_zoom }}"
        data-stations-endpoint="{{ map_config.stations_endpoint }}"
        data-tile-url="{{ map_config.tile_url }}"
        data-tile-attribution="{{ map_config.tile_attribution }}"
        data-tile-source-name="{{ map_config.tile_source_name }}"
    >
        <div class="map-toolbar" role="toolbar" aria-label="Map controls">
            <div class="map-toolbar-actions">
                <button type="button" class="button button-secondary" id="map-reset-view">Reset view</button>
                <button type="button" class="button button-secondary map-mask-toggle" id="map-mask-toggle" aria-pressed="false">Day mask</button>
            </div>
            <div class="map-info-strip" aria-live="polite">
                <span><strong>Tiles:</strong> <span id="map-tile-source">{{ map_config.tile_source_name }}</span></span>
                <span><strong>Center:</strong> <span id="map-center">--</span></span>
                <span><strong>Zoom:</strong> <span id="map-zoom">--</span></span>
            </div>
        </div>
        <div id="map-canvas" class="map-canvas" aria-label="Map viewer">
            <div id="map-mask" class="map-mask map-mask-day" aria-hidden="true"></div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', path='vendor/leaflet/leaflet.js') }}"></script>
<script src="{{ url_for('static', path='js/map.js') }}"></script>
{% endblock %}
