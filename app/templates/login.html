<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | APRSBox</title>
    <script>
        (() => {
            const storedTheme = localStorage.getItem("aprsbox-theme");
            document.documentElement.setAttribute("data-theme", storedTheme || "dark");
        })();
    </script>
    <link rel="stylesheet" href="{{ request.scope.root_path }}/static/css/style.css?v={{ app_version }}">
</head>
<body class="login-shell">
    <main class="login-card">
        <div class="panel-body">
            <div class="login-topbar">
                <h1>APRSBox</h1>
                <button type="button" class="theme-toggle" id="theme-toggle">Night Mode</button>
            </div>
            {% if login_error %}
            <div class="alert">{{ login_error }}</div>
            {% endif %}
            <form action="{{ request.scope.root_path }}/login" method="post" class="form-stack">
                <label class="full">
                    <span>Username</span>
                    <input type="text" name="username" autocomplete="username" required>
                </label>
                <label class="full">
                    <span>Password</span>
                    <input type="password" name="password" autocomplete="current-password" required>
                </label>
                <button type="submit" class="button">Sign In</button>
            </form>
        </div>
    </main>
    <script>
        (() => {
            const root = document.documentElement;
            const button = document.getElementById("theme-toggle");
            if (!button) return;
            const syncLabel = () => {
                button.textContent = root.getAttribute("data-theme") === "light" ? "Day Mode" : "Night Mode";
            };
            syncLabel();
            button.addEventListener("click", () => {
                const nextTheme = root.getAttribute("data-theme") === "light" ? "dark" : "light";
                root.setAttribute("data-theme", nextTheme);
                localStorage.setItem("aprsbox-theme", nextTheme);
                syncLabel();
            });
        })();
    </script>
</body>
</html>
